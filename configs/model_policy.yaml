# ARGUS Multi-Model Fabric — Call-Type Routing Policy (Phase 07).
#
# This configuration drives explicit model assignment per call type.
# CRITICAL: This is EXPLICIT USER/ARCHITECTURAL CONFIGURATION ONLY.
# ARGUS does NOT autonomously discover, rank, or choose models.
# The project owner decides all model assignments.
#
# Model IDs must match what the provider expects (e.g., Groq requires
# "openai/gpt-oss-120b" prefix; Gemini uses "gemini-3.5-flash-lite";
# OpenCode Zen uses "big-pickle" / "mimo-v2.5-free" / "nemotron-3-ultra-free"
# / "nemotron-3.5-lightning-free" — verified 2026-08-31 against
# opencode.ai/docs/zen and the live /zen/v1/models endpoint).
#
# Schema:
# call_types:
#   <call_type>:
#     primary: "<provider>/<model>"
#     fallbacks:
#       - "<provider>/<model>"
#       - "<provider>/<model>"
# provider_fallbacks: ["provider1", "provider2", ...]
#   Ordered list of providers to try if the primary provider fails entirely.
#
# D-014 (2026-08-30): all primary assignments moved to OpenCode Zen's free
# NVIDIA-hosted models. Non-zen providers remain as secondary fallbacks so
# the fabric keeps redundancy and cross-model verification stays possible.
#
# D-014 revision (2026-08-31, Model Policy Optimization): primary tiers split
# by latency vs quality. MiMo-V2.5 Free (mimo-v2.5-free) handles the
# latency-sensitive extractive call types; Big Pickle (big-pickle — NEW to the
# fabric, verified live on the configured Zen endpoint) handles the
# quality-sensitive generative/reasoning call types; Nemotron retains the
# primary fallback role. Non-zen secondary fallbacks unchanged.

call_types:
  general:
    primary: "zen/nemotron-3-ultra-free"
    fallbacks:
      - "zen/nemotron-3.5-lightning-free"
      - "groq/openai/gpt-oss-120b"
      - "gemini/gemini-3.5-flash-lite"
      - "cerebras/gpt-oss-120b"

  query_analysis:
    primary: "zen/mimo-v2.5-free"
    fallbacks:
      - "zen/nemotron-3.5-lightning-free"
      - "groq/openai/gpt-oss-20b"
      - "cerebras/gpt-oss-120b"

  research_planning:
    primary: "zen/big-pickle"
    fallbacks:
      - "zen/nemotron-3-ultra-free"
      - "groq/openai/gpt-oss-120b"
      - "gemini/gemini-3.5-flash-lite"
      - "cerebras/gpt-oss-120b"
    # Gemini added 2026-08-31 (live audit): gpt-oss-120b cannot reliably
    # generate the 12-field ResearchPlan strict schema (MODEL_LIMITATION),
    # while gemini-3.5-flash-lite does. This keeps a reachable, capable
    # fallback for the planner when the Zen primary is unavailable. Zen
    # big-pickle remains primary; Gemini is a fallback, not primary.

  evidence_extraction:
    primary: "zen/mimo-v2.5-free"
    fallbacks:
      - "zen/nemotron-3.5-lightning-free"
      - "groq/openai/gpt-oss-120b"
      - "cerebras/gpt-oss-120b"

  reasoning:
    primary: "zen/big-pickle"
    fallbacks:
      - "zen/nemotron-3-ultra-free"
      - "groq/openai/gpt-oss-120b"
      - "cerebras/gpt-oss-120b"

  synthesis:
    primary: "zen/big-pickle"
    fallbacks:
      - "zen/nemotron-3-ultra-free"
      - "groq/openai/gpt-oss-120b"
      - "cerebras/gpt-oss-120b"

  verification:
    primary: "zen/big-pickle"
    fallbacks:
      - "zen/mimo-v2.5-free"
      - "zen/nemotron-3-ultra-free"
      - "groq/openai/gpt-oss-20b"
      - "cerebras/gpt-oss-120b"

  revision:
    primary: "zen/mimo-v2.5-free"
    fallbacks:
      - "zen/nemotron-3.5-lightning-free"
      - "groq/openai/gpt-oss-20b"
      - "cerebras/gpt-oss-120b"

provider_fallbacks:
  - "zen"
  - "groq"
  - "gemini"
  - "cerebras"

# Quota tracking configuration (deterministic, configuration-driven)
# Phase 07 implements basic quota awareness for free-tier providers.
# Values are per-provider defaults; actual runtime values come from
# provider responses (rate limit headers) or periodic checks.
# Set to null to disable quota tracking for a provider.
quota:
  groq:
    requests_per_minute: 30
    requests_per_day: 1000
    tokens_per_minute: 8000
    tokens_per_day: 200000
    enabled: true
  gemini:
    requests_per_minute: 15
    requests_per_day: 1000
    tokens_per_minute: 250000
    tokens_per_day: 1000000
    enabled: true
  cerebras:
    requests_per_minute: 10
    requests_per_day: 500
    tokens_per_minute: 50000
    tokens_per_day: 1000000
    enabled: true
  zen:
    # D-014: exact free-tier rate limits for the NVIDIA-hosted zen models are
    # not published in the Zen docs as of 2026-08-30, so quota tracking stays
    # disabled (unlimited) rather than inventing numbers. Add real limits here
    # once confirmed.
    enabled: false

# Cross-model verification settings
cross_model_verification:
  enabled: true
  # Verifier must use a different provider than synthesizer
  verifier_must_differ_from_synthesizer: true
  # If no different provider available, allow same provider with different model
  allow_same_provider_different_model: true
  # Preferred verifier providers (in order)
  preferred_verifier_providers:
    - "zen"
    - "gemini"
    - "groq"
    - "cerebras"

# Telemetry settings
telemetry:
  enabled: true
  # Log routing decisions (provider, model, call_type, latency, tokens)
  log_routing_decisions: true
  # Track call count per run against ceiling
  enforce_call_ceiling: true
  # Hard ceiling on logical LLM calls per research run
  call_ceiling: 16
  # Warn when approaching ceiling
  call_ceiling_warn_threshold: 12