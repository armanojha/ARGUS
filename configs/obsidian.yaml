# ARGUS Obsidian integration configuration — Phase 05 (MVP).
#
# Real ingestion is implemented in Phase 05 (minimal MVP ingestion) and
# Phase 09 (full knowledge-class taxonomy, hypothesis-to-research-objective,
# vault-graph alignment, safe write-back workflow).
#
# `write_back_root` matches the dedicated write-back boundary defined in
# the ARGUS V3 architecture report (§4.3): ARGUS never writes outside this
# folder inside the user's vault.

enabled: true
vault_path: ""  # Set via ARGUS_OBSIDIAN_VAULT_PATH env var or here
write_back_root: "90_ARGUS"
incremental_sync: true
exclude_patterns:
  - "90_ARGUS/**"
  - ".obsidian/**"
  - ".git/**"
  - ".trash/**"
chunking_strategy: "obsidian_sections_v1"