# ARGUS LLM provider configuration (Phase 00.3 + Phase 07).
#
# Provider wiring for the LLM gateway. The active provider is selected by
# `ARGUS_LLM_PROVIDER` (defaults to "groq"). Each entry's `name` must match
# a registered provider in `app/llm_gateway/providers/__init__.py`.
#
# Per vault decision D-005: model names and free-tier quotas are mutable
# external dependencies. Verified at implementation time against provider docs.

providers:
  - name: groq
    enabled: true
    api_key_env: GROQ_API_KEY
    base_url: "https://api.groq.com/openai/v1"
    default_model: "openai/gpt-oss-120b"
    fallback_models: ["openai/gpt-oss-20b"]
    roles: [general]
    capabilities:
      structured_output: true
      tool_calling: true
      streaming: false
      max_context_tokens: 131072
      max_output_tokens: 8192
    timeout: 30.0
    max_retries: 2
    notes: "Groq free tier for GPT-OSS: 30 RPM, 1,000 RPD, 8,000 TPM, 200,000 TPD. Verified 2026-08-26."

  - name: gemini
    enabled: true
    api_key_env: GEMINI_API_KEY
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    default_model: "gemini-3.5-flash-lite"
    fallback_models: ["gemini-3.5-flash"]
    roles: [general]
    capabilities:
      structured_output: true
      tool_calling: true
      streaming: false
      max_context_tokens: 1048576
      max_output_tokens: 8192
    timeout: 60.0
    max_retries: 2
    notes: "Google Gemini free tier: 15 RPM, 1,000 RPD for flash-lite. Data used for training on free tier. Models gemini-3.5-flash-lite / gemini-3.5-flash verified live 2026-08-31 (gemini-2.5-* no longer available to new users)."

  - name: cerebras
    enabled: true
    api_key_env: CEREBRAS_API_KEY
    base_url: "https://api.cerebras.ai/v1"
    default_model: "gpt-oss-120b"
    fallback_models: []
    roles: [general]
    capabilities:
      structured_output: true
      tool_calling: true
      streaming: false
      max_context_tokens: 131072
      max_output_tokens: 8192
    timeout: 30.0
    max_retries: 2
    notes: "Cerebras free tier requires credit card ($5/30 days) as of 2026-08. Fast inference for GPT-OSS models."

  - name: zen
    enabled: true
    api_key_env: OPENCODE_ZEN_API_KEY
    protocol: "openai-compatible"
    base_url: "https://opencode.ai/zen/v1"
    default_model: "nemotron-3-ultra-free"
    fallback_models: ["big-pickle", "nemotron-3.5-lightning-free", "mimo-v2.5-free"]
    roles: [general]
    capabilities:
      structured_output: true
      tool_calling: true
      streaming: false
      max_context_tokens: 131072
      max_output_tokens: 8192
    timeout: 30.0
    max_retries: 2
    notes: "OpenCode Zen free-tier models (openai-compatible /chat/completions). Model IDs verified 2026-08-31 @ opencode.ai/docs/zen + live /zen/v1/models: big-pickle, mimo-v2.5-free, nemotron-3-ultra-free, nemotron-3.5-lightning-free. big-pickle (Big Pickle) added 2026-08-31 as the quality-sensitive primary per Model Policy Optimization. NVIDIA trial endpoints log session data. Key from https://opencode.ai/auth."