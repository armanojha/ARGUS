[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — Adaptive Autonomous Evidence & Reasoning Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/armanojha/ARGUS"
Repository = "https://github.com/armanojha/ARGUS"
Issues = "https://github.com/armanojha/ARGUS/issues"
Changelog = "https://github.com/armanojha/ARGUS/blob/main/CHANGELOG.md"

[project.authors]
name = "Arman Ojha"

# Intentionally empty: install via the optional-dependency groups below
# (e.g. `pip install -e ".[core,dev-test]"`), so each phase only pulls in
# what it needs.
dependencies = []

[project.optional-dependencies]
# Foundation: config, API surface, orchestration, logging, LLM gateway (Phases 00.1-00.3).
core = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.0.30",
    "structlog>=24.1",
    "httpx>=0.27",
]

# Hybrid retrieval (Phase 01; also reused by multimodal PDF/image ingestion).
retrieval = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
]

# BGE-M3 experimental retrieval backend (A/B testing against baseline).
bge_m3 = [
    "FlagEmbedding>=1.2",
    "scipy>=1.11",
]

# Evidence graph (Phase 03).
graph = [
    "networkx>=3.2",
]

# Multimodal ingestion (Phase 11): web, spreadsheets, OCR fallback.
# NOTE: legacy OCR requires the Tesseract system binary (configs/providers.yaml).
#
# The default OCR engine is PaddleOCR, which runs in an *isolated* Python 3.11+
# venv because PaddlePaddle (PaddleOCR's backend) has no wheels for the app's
# Python 3.14 interpreter. Build that env with:
#     py -3.11 -m venv .venv-ocr
#     .venv-ocr/Scripts/python -m pip install "paddlepaddle==3.2.2" "paddleocr>=3,<4"
# and set `ocr_engine=auto|paddle|tesseract` (see app/config.py OCR settings).
# PaddleOCR itself is NOT declared here because it is incompatible with 3.14.
multimodal = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

# Testing and linting.
"dev-test" = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
  extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true