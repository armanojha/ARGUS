[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — Adaptive Autonomous Evidence & Reasoning Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Intentionally empty: install via the optional-dependency groups below
# (e.g. `pip install -e ".[core,dev-test]"`), so each phase only pulls in
# what it needs.
dependencies = []

[project.optional-dependencies]
# Foundation: config, API surface, orchestration, logging (Phases 00.1-00.3).
core = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.0.30",
    "structlog>=24.1",
]

# Hybrid retrieval (Phase 01).
retrieval = [
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6",
]

# Evidence graph (Phase 03).
graph = [
    "networkx>=3.2",
]

# Testing and linting.
"dev-test" = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
